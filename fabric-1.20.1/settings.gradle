pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Mojang'; url = 'https://libraries.minecraft.net/' }
    }
}

// Fabric Loom shares its buildscript classloader with ForgeGradle in the
// multi-loader build, and ForgeGradle's Gson 2.9.1 makes Loom's reflective
// metadata parsing throw on Java 17. Building Fabric as its own project keeps
// its buildscript classpath clean. The shared core is still compiled directly
// into the jar, so the module stays self-contained.
rootProject.name = 'minedar-fabric-1-20-1'
