# MiNEDAR runtime test workflow.
#
# The Cline GitHub credential (cline-cloud[bot]) lacks the `workflows`
# permission, so this file could not be committed to .github/workflows/ from the
# agent environment. To enable real client runtime testing, copy this file to
# .github/workflows/minedar-runtime.yml (a user with workflow permission can do
# this, or run `gh workflow run` once it is in place).
name: MiNEDAR Runtime

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  runtime:
    name: Forge 1.20.1 runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb and input tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils libgl1-mesa-dri

      - name: Build the mod
        run: ./gradlew :forge-1.20.1:build --console=plain

      - name: Launch the client under Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=3.2
          export MESA_GLSL_VERSION_OVERRIDE=150
          timeout 420 ./gradlew :forge-1.20.1:runClient --console=plain > client.log 2>&1 || true
          cp forge-1.20.1/run/logs/latest.log latest.log 2>/dev/null || true
          echo '--- mod load line ---'
          grep -i 'MiNEDAR loaded' latest.log client.log || echo 'MiNEDAR load line not found'

      - name: Capture screenshot if the client window exists
        if: always()
        run: |
          export DISPLAY=:99
          mkdir -p screenshots
          xdotool search --name Minecraft > /tmp/win || true
          import -window root screenshots/root.png 2>/dev/null || true

      - name: Upload runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minedar-runtime
          path: |
            client.log
            latest.log
            screenshots/
          if-no-files-found: warn
          retention-days: 14
