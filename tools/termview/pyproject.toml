[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termview"
version = "0.1.0"
description = "Render a Minecraft (or any) window as a 1:1 terminal display, with keyboard control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "python-xlib>=0.33",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
termview = "termview.__main__:main"

[tool.setuptools]
packages = ["termview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
