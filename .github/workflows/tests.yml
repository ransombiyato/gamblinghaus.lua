name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils xterm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Render a demo frame (sanity artifact)
        run: |
          python scripts/demo.py --mode ascii --cols 64 --rows 16 > demo.txt || true
          cat demo.txt || true
