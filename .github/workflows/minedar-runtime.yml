# MiNEDAR runtime test workflow.
#
# Beyond a load smoke test, this starts a throwaway vanilla server, launches the
# built Forge client under Xvfb against it, drives the scanner with xdotool and
# captures screenshots so the LiDAR behaviour is actually exercised in CI.
name: MiNEDAR Runtime

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  runtime:
    name: Forge 1.20.1 runtime scan test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb, input and capture tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils imagemagick libgl1-mesa-dri python3-numpy python3-pil

      - name: Download and configure the test server
        run: |
          mkdir -p server
          python3 - <<'PY'
          import json, urllib.request
          meta = json.load(urllib.request.urlopen(
              "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          ver = next(v for v in meta["versions"] if v["id"] == "1.20.1")
          pkg = json.load(urllib.request.urlopen(ver["url"]))
          url = pkg["downloads"]["server"]["url"]
          print("server url", url)
          urllib.request.urlretrieve(url, "server/server.jar")
          PY
          echo "eula=true" > server/eula.txt
          cat > server/server.properties <<'PROP'
          online-mode=false
          level-type=minecraft\:flat
          spawn-protection=0
          max-players=5
          gamemode=creative
          difficulty=peaceful
          server-port=25565
          PROP

      - name: Build the mod
        run: ./gradlew :forge-1.20.1:build --console=plain

      - name: Start Xvfb and the test server
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          cd server
          mkfifo cmd.fifo
          (tail -f cmd.fifo | java -Xmx2G -jar server.jar nogui > server.log 2>&1 &)
          echo "waiting for the server to be ready..."
          for i in $(seq 1 60); do
            if grep -q 'Done (' server.log 2>/dev/null; then break; fi
            sleep 2
          done
          tail -3 server.log

      - name: Launch the client and connect
        run: |
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=3.2
          export MESA_GLSL_VERSION_OVERRIDE=150
          (timeout 900 ./gradlew :forge-1.20.1:runClient --console=plain \
              --args='--username Dev --quickPlayMultiplayer localhost:25565' > client.log 2>&1 &)
          echo "waiting for the client to join the world..."
          for i in $(seq 1 120); do
            if grep -q 'MiNEDAR tracking world' client.log 2>/dev/null; then break; fi
            sleep 5
          done
          grep -i 'MiNEDAR loaded\|MiNEDAR tracking world' client.log || true

      - name: Light the world and aim the camera at the ground
        run: |
          cd server
          # Give the client a moment to fully register before scripting the server.
          sleep 15
          printf 'op Dev\ntime set day\ngamerule doDaylightCycle false\nweather clear\n' > cmd.fifo
          sleep 3
          # Keep the operator's spawn position but pitch the camera down so the
          # scanner sweeps close terrain instead of empty sky.
          printf 'tp Dev ~ ~ ~ 0 55\n' > cmd.fifo
          sleep 3
          tail -6 server.log

      - name: Drive the scanner and capture screenshots
        run: |
          export DISPLAY=:99
          mkdir -p screenshots
          # Let the world settle and make sure the window has focus.
          sleep 5
          WID=$(xdotool search --name Minecraft | tail -1)
          echo "window=$WID"
          xdotool windowactivate "$WID" 2>/dev/null || true
          xdotool windowfocus "$WID" 2>/dev/null || true
          xdotool mousemove 640 360
          sleep 2
          import -window "$WID" screenshots/00_baseline.png
          # Minimap is on by default; capture it, then verify the M toggle hides it.
          import -window "$WID" screenshots/05_minimap_on.png
          xdotool key --clearmodifiers m
          sleep 2
          import -window "$WID" screenshots/06_minimap_off.png
          xdotool key --clearmodifiers m
          sleep 2
          # Toggle LiDAR on and let it render the (still dot-free) view.
          xdotool key --clearmodifiers g
          sleep 3
          import -window "$WID" screenshots/01_lidar_on.png
          # Continuous scan: hold the left button and sample the view rapidly so
          # the short accumulation burst is actually captured.
          xdotool mousedown 1
          for i in $(seq 1 10); do
            import -window "$WID" "screenshots/$(printf '%02d' $i)_scan.png"
            sleep 0.4
          done
          xdotool mouseup 1
          # Burst scan on the right button.
          xdotool mousedown 3
          sleep 2
          xdotool mouseup 3
          sleep 1
          import -window "$WID" screenshots/21_afterscan.png
          # Turn LiDAR back off; the world should reappear.
          xdotool key --clearmodifiers g
          sleep 3
          import -window "$WID" screenshots/30_lidar_off.png

      - name: Check the scan produced progressive change
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys
          from PIL import Image
          import numpy as np

          def load(p):
              return np.asarray(Image.open(p).convert("RGB"), dtype=np.int16)

          frames = sorted(glob.glob("screenshots/*_scan.png"))
          print("scan frames:", frames)
          if len(frames) < 2:
              print("FAIL: fewer than two scan frames captured")
              sys.exit(1)

          prev = None
          changed = 0
          for f in frames:
              img = load(f)
              if prev is not None:
                  diff = int((np.abs(img - prev).sum(2) > 40).sum())
                  print(f, "changed pixels vs previous:", diff)
                  if diff > 500:
                      changed += 1
              prev = img

          # The finished scan must also differ clearly from the empty LiDAR view.
          lidar_on = load("screenshots/01_lidar_on.png")
          final = load(frames[-1])
          grew = int((np.abs(final - lidar_on).sum(2) > 40).sum())
          print("final scan vs empty LiDAR view:", grew)

          failures = []
          with open("runtime-summary.txt", "w") as out:
              out.write("progressively-changing scan frames: %d\n" % changed)
              out.write("final-vs-empty changed pixels: %d\n" % grew)

          if changed < 1:
              failures.append("LiDAR scan did not change the view progressively")
          if grew < 500:
              failures.append("finished scan does not differ from the empty LiDAR view")

          # Minimap toggle must change the corner of the screen.
          on = load("screenshots/05_minimap_on.png")[:140, :140]
          off = load("screenshots/06_minimap_off.png")[:140, :140]
          mini = int((np.abs(on - off).sum(2) > 40).sum())
          print("minimap toggle corner changed pixels:", mini)
          with open("runtime-summary.txt", "a") as out:
              out.write("minimap-toggle changed pixels: %d\n" % mini)
          if mini < 200:
              failures.append("minimap toggle did not change the corner")

          # Turning LiDAR back off must restore the world view.
          off_lidar = load("screenshots/30_lidar_off.png")
          restored = int((np.abs(off_lidar - lidar_on).sum(2) > 40).sum())
          print("lidar off vs lidar on changed pixels:", restored)
          with open("runtime-summary.txt", "a") as out:
              out.write("lidar-off-vs-on changed pixels: %d\n" % restored)
          if restored < 2000:
              failures.append("disabling LiDAR did not restore the world")

          if failures:
              for f in failures:
                  print("FAIL:", f)
              sys.exit(1)
          print("OK: scan rendered progressive change")
          PY

      - name: Collect logs
        if: always()
        run: |
          cp forge-1.20.1/run/logs/latest.log latest.log 2>/dev/null || true
          cp server/server.log server.log 2>/dev/null || true
          echo '--- mod load lines ---'
          grep -i 'MiNEDAR loaded\|MiNEDAR tracking world' latest.log client.log || echo 'not found'

      - name: Upload runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minedar-runtime
          path: |
            client.log
            latest.log
            server.log
            runtime-summary.txt
            screenshots/
          if-no-files-found: warn
          retention-days: 14
