name: MiNEDAR Build

# Policy: every build (jar, and any future APK/other artefact) runs on GitHub
# Actions so the user can watch runs, rather than only building locally.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: minedar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic job: pure-Java core plus unit tests. Needs no Minecraft
  # assets, so it gives quick feedback on every push.
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: ./gradlew :common:test --console=plain

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: common/build/reports/tests/test

  # Full mod builds. Each loader/version is independent so one failing target
  # does not hide the others. Minecraft is decompiled on the runner, which takes
  # a few minutes the first time.
  forge-1_20_1:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :forge-1.20.1:build --console=plain
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minedar-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar

  forge-1_21_1:
    name: Forge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :forge-1.21.1:build --console=plain
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minedar-forge-1.21.1
          path: forge-1.21.1/build/libs/*.jar

